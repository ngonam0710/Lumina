[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
np-core = { path = "crates/core" }
np-platform = { path = "crates/platform" }
np-ui = { path = "crates/ui" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
